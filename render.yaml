databases:
  - name: clinic-db
    databaseName: clinic_db
    user: clinic_user
    plan: free

services:
  - type: web
    name: clinic-management-system
    env: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_SEED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString
